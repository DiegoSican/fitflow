services:

  # ======================================================
  # CONSUL - SERVICE REGISTRY
  # ======================================================

  consul:
    image: hashicorp/consul:1.17
    container_name: fitflow-consul

    ports:
      - "8500:8500"

    command: agent -dev -client=0.0.0.0

    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ======================================================
  # USERS DATABASE
  # ======================================================

  users-db:
    image: postgres:16-alpine
    container_name: fitflow-users-db

    environment:
      POSTGRES_DB: ${USERS_DB_NAME}
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - users-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${USERS_DB_USER} -d ${USERS_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  # ======================================================
  # BOOKING DATABASE
  # ======================================================

  booking-db:
    image: postgres:16-alpine
    container_name: fitflow-booking-db

    environment:
      POSTGRES_DB: ${BOOKING_DB_NAME}
      POSTGRES_USER: ${BOOKING_DB_USER}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - booking-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BOOKING_DB_USER} -d ${BOOKING_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  # ======================================================
  # NOTIFICATION DATABASE
  # ======================================================

  notif-db:
    image: postgres:16-alpine
    container_name: fitflow-notif-db

    environment:
      POSTGRES_DB: ${NOTIF_DB_NAME}
      POSTGRES_USER: ${NOTIF_DB_USER}
      POSTGRES_PASSWORD: ${NOTIF_DB_PASSWORD}

    ports:
      - "5435:5432"

    volumes:
      - notif-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${NOTIF_DB_USER} -d ${NOTIF_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  # ======================================================
  # USERS SERVICE
  # ======================================================

  users-svc:
    build:
      context: ./users-svc
      dockerfile: Dockerfile

    container_name: fitflow-users-svc

    environment:
      USERS_DB_NAME: ${USERS_DB_NAME}
      USERS_DB_USER: ${USERS_DB_USER}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD}
      USERS_DB_HOST: users-db
      USERS_DB_PORT: "5432"
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}

    ports:
      - "8003:8003"

    depends_on:
      users-db:
        condition: service_healthy
      consul:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/readyz', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ======================================================
  # BOOKING SERVICE
  # ======================================================

  booking-svc:
    build:
      context: ./booking-svc
      dockerfile: Dockerfile

    container_name: fitflow-booking-svc

    environment:
      BOOKING_DB_NAME: ${BOOKING_DB_NAME}
      BOOKING_DB_USER: ${BOOKING_DB_USER}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      BOOKING_DB_HOST: booking-db
      BOOKING_DB_PORT: "5432"
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}

    ports:
      - "8001:8001"

    depends_on:
      booking-db:
        condition: service_healthy
      consul:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ======================================================
  # NOTIFICATION SERVICE
  # ======================================================

  notif-svc:
    build:
      context: ./notif-svc
      dockerfile: Dockerfile

    container_name: fitflow-notif-svc

    environment:
      NOTIF_DB_NAME: ${NOTIF_DB_NAME}
      NOTIF_DB_USER: ${NOTIF_DB_USER}
      NOTIF_DB_PASSWORD: ${NOTIF_DB_PASSWORD}
      NOTIF_DB_HOST: notif-db
      NOTIF_DB_PORT: "5432"
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"

    ports:
      - "8002:8002"

    depends_on:
      notif-db:
        condition: service_healthy
      consul:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/readyz', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ======================================================
  # FITFLOW MCP SERVER
  # ======================================================

  fitflow-mcp:
    build:
      context: ./fitflow-mcp
      dockerfile: Dockerfile

    container_name: fitflow-mcp

    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      MCP_TRANSPORT: streamable-http

    ports:
      - "8000:8000"

    depends_on:
      consul:
        condition: service_healthy
      booking-svc:
        condition: service_healthy

  # ======================================================
  # A2A AGENTS
  # ======================================================

  booking-agent:
    build:
      context: ./a2a-agents
      dockerfile: Dockerfile
    container_name: fitflow-booking-agent
    environment:
      AGENT_ROLE: booking
      AGENT_PORT: "9001"
      AGENT_URL: "http://booking-agent:9001"
      MCP_URL: "http://fitflow-mcp:8000/mcp"
    ports:
      - "9001:9001"
    depends_on:
      - fitflow-mcp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9001/healthz')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-agent:
    build:
      context: ./a2a-agents
      dockerfile: Dockerfile
    container_name: fitflow-notification-agent
    environment:
      AGENT_ROLE: notification
      AGENT_PORT: "9002"
      AGENT_URL: "http://notification-agent:9002"
      MCP_URL: "http://fitflow-mcp:8000/mcp"
    ports:
      - "9002:9002"
    depends_on:
      - fitflow-mcp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9002/healthz')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator-agent:
    build:
      context: ./a2a-agents
      dockerfile: Dockerfile
    container_name: fitflow-orchestrator-agent
    environment:
      AGENT_ROLE: orchestrator
      AGENT_PORT: "9000"
      AGENT_URL: "http://orchestrator-agent:9000"
      BOOKING_CARD_URL: "http://booking-agent:9001/.well-known/agent.json"
      NOTIFICATION_CARD_URL: "http://notification-agent:9002/.well-known/agent.json"
    ports:
      - "9000:9000"
    depends_on:
      booking-agent:
        condition: service_healthy
      notification-agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

# ======================================================
# VOLUMES
# ======================================================

volumes:
  users-db-data:
  booking-db-data:
  notif-db-data: