services:

  # ======================================================
  # USERS DATABASE
  # ======================================================

  users-db:
    image: postgres:16-alpine
    container_name: fitflow-users-db

    environment:
      POSTGRES_DB: ${USERS_DB_NAME}
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - users-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${USERS_DB_USER} -d ${USERS_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  # ======================================================
  # BOOKING DATABASE
  # ======================================================

  booking-db:
    image: postgres:16-alpine
    container_name: fitflow-booking-db

    environment:
      POSTGRES_DB: ${BOOKING_DB_NAME}
      POSTGRES_USER: ${BOOKING_DB_USER}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - booking-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BOOKING_DB_USER} -d ${BOOKING_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  # ======================================================
  # NOTIFICATION DATABASE
  # ======================================================

  notif-db:
    image: postgres:16-alpine
    container_name: fitflow-notif-db

    environment:
      POSTGRES_DB: ${NOTIF_DB_NAME}
      POSTGRES_USER: ${NOTIF_DB_USER}
      POSTGRES_PASSWORD: ${NOTIF_DB_PASSWORD}

    ports:
      - "5435:5432"

    volumes:
      - notif-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${NOTIF_DB_USER} -d ${NOTIF_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  # ======================================================
  # USERS SERVICE
  # ======================================================

  users-svc:
    build:
      context: ./users-svc
      dockerfile: Dockerfile

    container_name: fitflow-users-svc

    environment:
      USERS_DB_NAME: ${USERS_DB_NAME}
      USERS_DB_USER: ${USERS_DB_USER}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD}
      USERS_DB_HOST: users-db
      USERS_DB_PORT: "5432"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}

    ports:
      - "8003:8003"

    depends_on:
      users-db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/readyz', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ======================================================
  # BOOKING SERVICE
  # ======================================================

  booking-svc:
    build:
      context: ./booking-svc
      dockerfile: Dockerfile

    container_name: fitflow-booking-svc

    environment:
      BOOKING_DB_NAME: ${BOOKING_DB_NAME}
      BOOKING_DB_USER: ${BOOKING_DB_USER}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      BOOKING_DB_HOST: booking-db
      BOOKING_DB_PORT: "5432"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}

    ports:
      - "8001:8001"

    depends_on:
      booking-db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ======================================================
  # NOTIFICATION SERVICE
  # ======================================================

  notif-svc:
    build:
      context: ./notif-svc
      dockerfile: Dockerfile

    container_name: fitflow-notif-svc

    environment:
      NOTIF_DB_NAME: ${NOTIF_DB_NAME}
      NOTIF_DB_USER: ${NOTIF_DB_USER}
      NOTIF_DB_PASSWORD: ${NOTIF_DB_PASSWORD}
      NOTIF_DB_HOST: notif-db
      NOTIF_DB_PORT: "5432"

    ports:
      - "8002:8002"

    depends_on:
      notif-db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/readyz', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  users-db-data:
  booking-db-data:
  notif-db-data: